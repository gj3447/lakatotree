name: TypeScript canonical CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pnpm verify — canonical TypeScript gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lakatotree_ts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lakatotree_ts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LAKATOS_TS_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/lakatotree_ts_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11.21.0"
      - name: Install pinned TypeScript workspace
        run: pnpm --dir ts install --frozen-lockfile
      - name: Verify canonical implementation
        run: pnpm verify
