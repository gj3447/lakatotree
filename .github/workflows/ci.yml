name: ci

# Clean-container CI for LakatoTree's independent architectural, behavior,
# integration, receipt, and formal-kernel gates.
# Every job starts from a fresh checkout and installs only its declared pinned requirement
# manifests, catching dependency/runtime drift that made "tests green" unreproducible before.
# "receipts, not claims" applies to the build itself.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-wheel:
    name: storage-wheel — installable fresh-bootstrap resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel without source-tree fallback
        run: |
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/wheel"
          python - "$RUNNER_TEMP/wheel" <<'PY'
          import pathlib, sys, zipfile
          wheels = list(pathlib.Path(sys.argv[1]).glob("lakatotree-*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              required = {
                  "lakatos/resource_coordination.py",
                  "lakatos/resource_kernel.py",
                  "lakatos/io/_resource_journal_contracts.py",
                  "lakatos/io/_resource_journal_codec.py",
                  "lakatos/io/_resource_anchor.py",
                  "lakatos/io/resource_journal.py",
                  "server/schema.sql",
                  "server/storage_migrations/critique_history_v1.sql",
                  "server/storage_migrations/outbox_identity_v1.cypher",
                  "server/storage_provisioning/postgresql_large_object_acl_v1.sql",
              }
              assert required <= names, required - names
              entry_points = next(
                  archive.read(name).decode()
                  for name in names if name.endswith(".dist-info/entry_points.txt")
              )
              assert "lakatotree-storage-predeploy = server.storage_predeploy:main" in entry_points
              assert "lakatotree-readiness-harness = server.production_readiness:main" in entry_points
              assert "lakatotree-readiness-collect = server.production_readiness_live:main" in entry_points
              assert "lakatotree-storage-audit = server.storage_access_live:main" in entry_points
              assert "lakatotree-storage-access-verify = server.storage_access_verify:main" in entry_points
              assert "lakatotree-runtime-authority-verify = server.runtime_authority:main" in entry_points
              assert "lakatotree-production-approval-verify = server.production_approval:main" in entry_points
          PY
      - name: Install and execute the packaged storage surface
        run: |
          storage_wheel=$(find "$RUNNER_TEMP/wheel" -maxdepth 1 -name 'lakatotree-*.whl' -print -quit)
          test -n "$storage_wheel"
          python -m venv "$RUNNER_TEMP/readiness-base-wheel-venv"
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/pip" install --no-deps "$storage_wheel"
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/pip" check
          for suffix in a b; do
            python -m venv "$RUNNER_TEMP/storage-wheel-venv-$suffix"
            "$RUNNER_TEMP/storage-wheel-venv-$suffix/bin/pip" install "${storage_wheel}[storage]"
            "$RUNNER_TEMP/storage-wheel-venv-$suffix/bin/pip" check
          done
          python -m venv "$RUNNER_TEMP/readiness-live-wheel-venv"
          "$RUNNER_TEMP/readiness-live-wheel-venv/bin/pip" install \
            "${storage_wheel}[readiness-live]"
          "$RUNNER_TEMP/readiness-live-wheel-venv/bin/pip" check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/lakatotree-readiness-harness" --help
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/lakatotree-readiness-collect" --help
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/lakatotree-storage-access-verify" --help
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/lakatotree-runtime-authority-verify" --help
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/lakatotree-production-approval-verify" --help
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/python" - <<'PY'
          import pathlib, tempfile
          from lakatos.io.resource_journal import AnchorStatus, SQLiteResourceJournal
          from lakatos.resource_coordination import ResourceState, ResourceVector

          with tempfile.TemporaryDirectory() as raw:
              root = pathlib.Path(raw)
              journal = SQLiteResourceJournal(root / "resource.sqlite3")
              created = journal.initialize(ResourceState.create(
                  budget_id="wheel-budget", scope="tree:wheel", epoch=1,
                  hard_caps=ResourceVector(1, 1, 1),
              ))
              loaded = journal.load("tree:wheel")
              assert created.state == loaded.state
              assert loaded.anchor_status is AnchorStatus.PENDING
          PY
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/python" - \
            "$GITHUB_WORKSPACE/ooptdd_receipts/PRODUCTION_L3_READINESS/harness.json" \
            "$GITHUB_WORKSPACE/ooptdd_receipts/PRODUCTION_L3_READINESS/fixture.v1.json" \
            "$RUNNER_TEMP/readiness-base-wheel-venv/bin/lakatotree-readiness-harness" <<'PY'
          import json, pathlib, subprocess, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          fixture = pathlib.Path(sys.argv[2]).resolve()
          completed = subprocess.run(
              [sys.argv[3], "--evidence", str(fixture), "--evidence-sha256",
               manifest["fixture"]["file_sha256"]],
              check=False, capture_output=True, text=True,
          )
          assert completed.returncode == 0, completed.stderr
          report = json.loads(completed.stdout)
          assert report["status"] == "CASE_ACCEPTED"
          assert report["evidence_bytes_bound"] is True
          assert report["production_ready"] is False
          assert report["l3_assurance"] == "UNAVAILABLE"
          PY
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/python" - <<'PY'
          from server.production_readiness import evaluate_readiness
          from server.production_readiness_live import (
              NEO4J_PASSWORD_ENV, NEO4J_URI_ENV, NEO4J_USER_ENV,
              POSTGRESQL_DSN_ENV, collect_live_evidence, collect_neo4j,
              collect_postgresql,
          )
          assert callable(evaluate_readiness)
          assert callable(collect_live_evidence)
          pg = collect_postgresql(
              {"database": "lakatos", "owner_role": "owner",
               "migrator_role": "migrator", "runtime_role": "runtime"},
              3, {POSTGRESQL_DSN_ENV: "host=127.0.0.1 dbname=lakatos"},
          )
          neo = collect_neo4j(
              {"database": "neo4j"}, 1,
              {NEO4J_URI_ENV: "bolt+s://127.0.0.1:1", NEO4J_USER_ENV: "u",
               NEO4J_PASSWORD_ENV: "p"},
          )
          assert pg.failure_codes == ("postgresql.dependency_unavailable",)
          assert neo.failure_codes == ("neo4j.dependency_unavailable",)
          PY
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/python" - \
            "$RUNNER_TEMP/readiness-base-wheel-venv/bin/lakatotree-runtime-authority-verify" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          from datetime import datetime, timedelta, timezone
          from lakatos.write_cert import ed25519_public_key, ed25519_sign
          from server.runtime_authority import (
              RUNTIME_SNAPSHOT_SCHEMA, build_runtime_challenge, canonical_json,
              challenge_sha256, signing_bytes,
          )
          now = datetime.now(timezone.utc)
          secret = bytes([29]) * 32
          public = ed25519_public_key(secret).hex()
          artifact = {
              "kind": "wheel-record",
              "version": "0.1.0",
              "installed_manifest_sha256": "a" * 64,
              "record_verified_files": 32,
              "stable_files": 64,
          }
          boot = "e" * 64
          challenge = build_runtime_challenge(
              nonce="d" * 64, environment="production", boot_id=boot,
              artifact=artifact, operation_sha256="1" * 64,
              target_sha256="2" * 64,
              storage_access_policy_file_sha256="3" * 64,
              predeploy_receipt_file_sha256="4" * 64,
              predeploy_receipt_sha256="5" * 64,
              startup_bundle_file_sha256="6" * 64,
              historical_drain_lease_id_sha256="7" * 64,
              runtime_writer_lease={
                  "lease_id": "critique-history-writer-v1",
                  "owner_token_sha256": "c" * 64,
                  "generation": 1,
                  "postgresql_backend_pid": 4242,
                  "postgresql_advisory_key": [1279349588, 20260802],
              },
              workers=[{"worker_id": "8" * 64, "boot_id": boot}],
          )
          body = {
              "schema_version": RUNTIME_SNAPSHOT_SCHEMA,
              "challenge_sha256": challenge_sha256(challenge),
              **{key: value for key, value in challenge.items()
                 if key != "schema_version"},
              "active": True,
              "observed_at": now.isoformat(),
              "expires_at": (now + timedelta(seconds=20)).isoformat(),
              "evidence_refs": ["9" * 64],
          }
          snapshot = canonical_json({
              **body,
              "signature": ed25519_sign(secret, signing_bytes(body)).hex(),
          })
          artifact_raw = canonical_json(artifact)
          snapshot_path = pathlib.Path("runtime-snapshot.json").resolve()
          artifact_path = pathlib.Path("runtime-artifact.json").resolve()
          snapshot_path.write_bytes(snapshot)
          artifact_path.write_bytes(artifact_raw)
          completed = subprocess.run([
              sys.argv[1], "--snapshot", str(snapshot_path),
              "--snapshot-sha256", hashlib.sha256(snapshot).hexdigest(),
              "--expected-artifact", str(artifact_path),
              "--expected-artifact-sha256", hashlib.sha256(artifact_raw).hexdigest(),
              "--public-key-hex", public, "--evaluated-at", now.isoformat(),
          ], check=False, capture_output=True, text=True)
          assert completed.returncode == 0, completed.stderr
          report = json.loads(completed.stdout)
          assert report["artifact_kind"] == "wheel-record"
          assert report["production_ready"] is False
          assert report["deployment_status"] == "NOT_READY"
          PY
          "$RUNNER_TEMP/readiness-base-wheel-venv/bin/python" - \
            "$RUNNER_TEMP/readiness-base-wheel-venv/bin/lakatotree-readiness-collect" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          request = {
              "schema_version": "lakatotree-production-readiness-collection-request/v1",
              "target_id": "wheel-smoke",
              "timeout_seconds": 1,
              "adapters": {
                  "runtime": None, "postgresql": None, "neo4j": None,
                  "predeploy": None, "temporal": None,
              },
          }
          raw = json.dumps(
              request, sort_keys=True, separators=(",", ":")
          ).encode()
          request_path = pathlib.Path("readiness-request.json").resolve()
          output_path = pathlib.Path("readiness-evidence.json").resolve()
          request_path.write_bytes(raw)
          completed = subprocess.run(
              [sys.argv[1], "--request", str(request_path), "--request-sha256",
               hashlib.sha256(raw).hexdigest(), "--output", str(output_path)],
              check=False, capture_output=True, text=True,
          )
          assert completed.returncode == 1, completed.stderr
          evidence = json.loads(output_path.read_text())
          assert evidence["status"] == "COLLECTION_INCOMPLETE"
          assert evidence["request_bytes_bound"] is True
          assert evidence["verification_status"] == "UNVERIFIED"
          assert evidence["snapshot_coherence"] == "UNATTESTED"
          assert "mutation_attempts" not in evidence
          assert "production_ready" not in evidence
          PY
          "$RUNNER_TEMP/readiness-live-wheel-venv/bin/python" - <<'PY'
          import cryptography, neo4j, psycopg2, pydantic
          from server.production_readiness_live import default_ports
          assert callable(default_ports)
          PY
          "$RUNNER_TEMP/storage-wheel-venv-a/bin/lakatotree-storage-predeploy" --help
          "$RUNNER_TEMP/storage-wheel-venv-a/bin/lakatotree-storage-audit" --help
          for suffix in a b; do
            "$RUNNER_TEMP/storage-wheel-venv-$suffix/bin/python" - \
              > "$RUNNER_TEMP/storage-identity-$suffix.json" <<'PY'
          import importlib.resources, json, psycopg2, neo4j
          from server.storage_predeploy import (
              _artifact_identity, migration_sources, operation_identity,
          )
          assert set(migration_sources()) == {
              "critique_history_v1.sql", "outbox_identity_v1.cypher",
              "temporal_proof_identity_v1.cypher",
          }
          provisioning = importlib.resources.files(
              "server.storage_provisioning"
          ).joinpath("postgresql_large_object_acl_v1.sql").read_text()
          assert "requires a direct superuser session" in provisioning
          identity = _artifact_identity()
          assert identity["kind"] == "wheel-record"
          assert identity["record_verified_files"] > 0
          assert operation_identity(identity)["artifact"] == identity
          print(json.dumps(identity, sort_keys=True))
          PY
          done
          cmp "$RUNNER_TEMP/storage-identity-a.json" "$RUNNER_TEMP/storage-identity-b.json"
          "$RUNNER_TEMP/storage-wheel-venv-b/bin/python" - <<'PY'
          import cryptography
          from server.storage_predeploy import _verify_fence_response_signature
          body = {
              "active": True,
              "drain_receipt_sha256": "d" * 64,
              "environment": "staging",
              "evidence_refs": ["lease-store://exact-readback"],
              "expires_at": "2026-08-02T00:00:20+00:00",
              "lease_id": "lease-1",
              "nonce": "1" * 64,
              "operation_sha256": "b" * 64,
              "schema_version": "lakatotree-writer-fence-verification/v2",
              "target_sha256": "a" * 64,
              "verified_at": "2026-08-02T00:00:00+00:00",
          }
          public_key = "03a107bff3ce10be1d70dd18e74bc09967e4d6309ba50d5f1ddc8664125531b8"
          signature = (
              "ec00791adafe8ad7e29fb5e66c1c92d1c925614bec0ae3284a466280e71a6183"
              "e1631102e99341c11253cc869a446e99da3e1d6f33c0821f5e3e6baafed06905"
          )
          assert _verify_fence_response_signature(
              {**body, "signature": signature}, public_key
          ) == body
          PY
          "$RUNNER_TEMP/storage-wheel-venv-a/bin/python" - <<'PY'
          from pathlib import Path
          import server.storage_predeploy as module
          path = Path(module.__file__)
          path.write_bytes(path.read_bytes() + b"\n# tamper\n")
          try:
              module._artifact_identity()
          except RuntimeError as exc:
              assert "RECORD" in str(exc)
          else:
              raise AssertionError("coordinator tamper was not detected")
          PY
          "$RUNNER_TEMP/storage-wheel-venv-b/bin/python" - <<'PY'
          import importlib.resources
          from pathlib import Path
          import server.storage_predeploy as module
          resource = importlib.resources.files("server.storage_migrations").joinpath(
              "critique_history_v1.sql"
          )
          path = Path(str(resource))
          path.write_bytes(path.read_bytes() + b"\n-- tamper\n")
          try:
              module._artifact_identity()
          except RuntimeError as exc:
              assert "RECORD" in str(exc)
          else:
              raise AssertionError("migration resource tamper was not detected")
          PY

  import-boundaries:
    name: import-boundaries — architectural layering (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned deps (clean — requirements.txt only)
        run: pip install -r requirements.txt
      - name: lint-imports (layering gate — static)
        run: lint-imports

  engine:
    name: engine — full pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # frozen protocol tests read historical source blobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # the version the suite is verified green against
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned deps (clean — requirements.txt only)
        run: pip install -r requirements.txt
      - name: pytest (engine + server contract)
        run: python -m pytest tests/ -q

  integration:
    # #3: 통합티어(실 Neo4j+PG kg_tx 원자성/멱등 = README "가장 consequential" 보증)를 CI 에서 실제로 실행.
    # 전엔 LAKATOS_IT 미설정이라 8개 integration 테스트가 영영 skip(죽은 게이트)이었다.
    # P0 closure: 실제 저장소 계약은 릴리스 차단 게이트다. 재시도로 flaky 를 녹색화하지 않는다.
    name: integration — Neo4j + ${{ matrix.pg_image }} (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg_image: ["postgres:16-alpine", "postgres:17-alpine"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-integration.txt
      - name: Install deps (unit + integration tier)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-integration.txt
      - name: Assert blocking integration dependencies are importable
        run: python -c "import testcontainers.neo4j, testcontainers.postgres"
      - name: pytest integration tier (real Neo4j+PG via testcontainers)
        env:
          LAKATOS_IT: "1"
          LAKATOS_PG_IMAGE: ${{ matrix.pg_image }}
        run: python -m pytest tests/integration -q

  argument-integrity-harness:
    # ARG-1..5는 일반 차단 통합티어보다 더 강한 증거 영수증이다. current GREEN,
    # historical ARG-1..4 semantic RED, targeted ARG-5 claim RED, restored GREEN을 순서대로 실행한다.
    name: argument-integrity — real Neo4j+PG targeted semantic-negative receipt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historical negative-control revision을 git archive로 읽어야 한다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-integration.txt
      - name: Install pinned unit and integration dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-integration.txt
      - name: Materialize frozen v1 source commit
        run: |
          git clone --no-local --no-checkout "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/argument-integrity-v1-source"
          git -C "$RUNNER_TEMP/argument-integrity-v1-source" checkout --detach \
            1c4c57d691239950f6479b32e7531898fb7dcefa
          test "$(git -C "$RUNNER_TEMP/argument-integrity-v1-source" rev-parse HEAD)" = \
            1c4c57d691239950f6479b32e7531898fb7dcefa
      - name: Capture frozen ARG-1..5 real-datastore receipt
        working-directory: ${{ runner.temp }}/argument-integrity-v1-source
        run: |
          python ooptdd_receipts/ARGUMENT_INTEGRITY/real_harness.py \
            --artifact-dir "$RUNNER_TEMP/argument-integrity-harness" \
            --timeout 900
      - name: Replay frozen structural validator outside the bundle
        working-directory: ${{ runner.temp }}/argument-integrity-v1-source
        run: |
          python judges/argument_integrity_bundle_validator.py \
            --artifact-dir "$RUNNER_TEMP/argument-integrity-harness" \
            --output "$RUNNER_TEMP/argument-integrity-validation.json"
      - name: Upload ARG-1..5 receipt bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argument-integrity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/argument-integrity-harness
            ${{ runner.temp }}/argument-integrity-validation.json
          if-no-files-found: error

  kernel-quality:
    # #6: 커널 품질 ratchet 을 실제 CI 로. coverage(verdict+quant ≥95%)는 *차단*(현 98%+), mutation 은 비차단.
    # 스크립트는 PY 오버라이드를 지원하므로 runner 에선 PY=python (로컬 .venv 경로 대신).
    name: kernel-quality — coverage ratchet (gate) + mutation (allow-failure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # frozen protocol tests read historical source blobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps (unit + dev)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: coverage ratchet (verdict+quant kernel >=95%, gating)
        run: PY=python bash scripts/coverage_kernel.sh
      - name: mutation (verdict kernel mutmut, allow-failure)
        continue-on-error: true
        run: PY=python bash scripts/mutation_kernel.sh

  formal:
    name: formal — lake build + axiom audit (Lean 4, sorry=0, Ω-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (toolchain pinned by formal/lean-toolchain → v4.27.0)
        working-directory: formal
        run: lake build   # ground-truth gate: error=0, sorry=0
      - name: axiom audit (Ω={propext, Classical.choice, Quot.sound} 외 공리 차단)
        working-directory: formal
        run: bash axiom_audit.sh   # "verified" = kernel check + axiom audit 세트일 때만

  ooptdd-receipts:
    # ooptdd-loop 영수증 전체를 자동발견해 상시 재검증 — pytest 가 아니라 R02(구조화 이벤트
    # trace 도착) + R10(Longinus 바인딩) 기준. 각 emit-adapter(ooptdd_receipts/<F>/)가 *실제 고쳐진* 엔진
    # 코드를 in-process 구동하고 음성 오라클을 포함하므로, 엔진이 회귀해 결함이 돌아오면 해당 영수증이 RED.
    # ★self-contained 차단 게이트(continue-on-error 제거): loop runner 를 _vendor/ooptdd_loop (base ooptdd
    #   는 _vendor/ooptdd) 로 벤더해 private repo·시크릿 의존을 없앴다 — requirements.txt(+pyyaml)만으로 돈다.
    name: ooptdd-receipts — all auto-discovered receipts (R02 trace + R10 Longinus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned deps (clean — requirements.txt only)
        run: pip install -r requirements.txt
      - name: re-verify every ooptdd-loop receipt (vendored loop, no secret)
        run: python ooptdd_receipts/run_all.py   # 발견된 전체가 green 아니면 exit 1

  c1verify-standalone:
    # campaign C1 / P0b — engine-independence as a CONSTRUCTION FACT, not a promise. Install ONLY the
    # external verifier into a fresh venv where lakatos/server are NOT present, then run its suite via
    # `--pyargs` against the INSTALLED package (the repo, which contains lakatos/, is never on the path).
    # An accidental `import lakatos` anywhere in c1verify is an ImportError here — not a green test —
    # strictly stronger than the import-linter forbidden contract alone. Stdlib-only: no requirements.txt.
    name: c1verify-standalone — external verifier in a lakatos-free venv (P0b)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: fresh venv with ONLY c1verify (+pytest); engine absent
        run: |
          python -m venv /tmp/c1venv
          /tmp/c1venv/bin/pip install ./c1verify pytest
      - name: assert lakatos/server are NOT importable in this venv
        run: |
          cd /tmp && /tmp/c1venv/bin/python - <<'PY'
          import importlib.util as u
          for m in ("lakatos", "server"):
              assert u.find_spec(m) is None, f"{m} leaked into the clean venv — isolation broken"
          print("clean venv confirmed: lakatos/server absent")
          PY
      - name: run the installed c1verify suite (any engine import => ImportError => RED)
        run: cd /tmp && /tmp/c1venv/bin/python -m pytest --pyargs c1verify.tests -q
      - name: isolated interpreter disables site and bytecode side effects
        run: |
          cd /tmp && /tmp/c1venv/bin/python -I -S -B - <<'PY'
          import sys
          assert "site" not in sys.modules
          assert not any("site-packages" in item for item in sys.path)
          assert sys.dont_write_bytecode is True
          PY
      - name: installed temporal CLI is present and malformed evidence fails closed
        run: |
          cd /tmp
          set +e
          printf '{}' | /tmp/c1venv/bin/c1verify-temporal \
            > "$RUNNER_TEMP/c1-temporal-report.json" \
            2> "$RUNNER_TEMP/c1-temporal-stderr.txt"
          cli_rc=$?
          set -e
          test "$cli_rc" -eq 2
          test ! -s "$RUNNER_TEMP/c1-temporal-stderr.txt"
          /tmp/c1venv/bin/python - "$RUNNER_TEMP/c1-temporal-report.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          report = json.loads(raw)
          assert report["schema_version"] == "lakatotree-c1-two-ended-temporal-report/v1"
          assert report["status"] == "ERROR"
          assert report["input_sha256"] == hashlib.sha256(b"{}").hexdigest()
          assert report["reason_code"] == "batch.field_set"
          assert raw == json.dumps(
              report, sort_keys=True, separators=(",", ":"),
              ensure_ascii=False, allow_nan=False,
          ).encode("utf-8") + b"\n"
          PY
