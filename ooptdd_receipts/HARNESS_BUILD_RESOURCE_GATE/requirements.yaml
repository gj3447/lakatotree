# RED was observed before implementation: the focused pytest could not import
# lakatos.build_execution. The adapter below drives real SQLite journals, target
# effects, subprocesses, recovery, settlement, and isolated source mutants.
name: lakatotree-harness-build-resource-gate
target:
  mode: in_process
  callable: harness_build_resource_gate_receipt:verify
  backend: memory
  root: "."

requirements:
  - id: HBRG-1
    description: One harness build crosses confirmed admission and authenticated dispatch, commits one target-fenced subprocess result, meters wall time, and settles before scientific judging.
    gate:
      - {event: gated_build_runs_once_and_settles, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:gated_build_runs_once_and_settles
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: gated_build_runs_once_and_settles

  - id: HBRG-2
    description: A response lost after terminal target commit is recovered by lookup and never launches the subprocess twice.
    gate:
      - {event: terminal_response_loss_recovers_without_redispatch, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:terminal_response_loss_recovers_without_redispatch
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: terminal_response_loss_recovers_without_redispatch

  - id: HBRG-3
    description: A crash after durable claim but before terminal evidence remains unknown across restart and never relaunches the ambiguous effect.
    gate:
      - {event: nonterminal_claim_stays_unknown_without_redispatch, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:nonterminal_claim_stays_unknown_without_redispatch
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: nonterminal_claim_stays_unknown_without_redispatch

  - id: HBRG-4
    description: A nonzero build is a terminal metered effect that settles first, then reaches the existing BuildFailed scientific boundary without judge execution.
    gate:
      - {event: nonzero_build_settles_then_fails_scientifically, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:nonzero_build_settles_then_fails_scientifically
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: nonzero_build_settles_then_fails_scientifically

  - id: HBRG-5
    description: Workload identity changes for every declared execution input, including shell, isolation identity and policy, output evidence bounds, and input manifest.
    gate:
      - {event: workload_identity_binds_execution_inputs, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:workload_identity_binds_execution_inputs
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: workload_identity_binds_execution_inputs

  - id: HBRG-6
    description: Replacing the build-specific harness port with legacy bash in an isolated source copy performs a forbidden marker effect, proving the wiring guard is load-bearing.
    gate:
      - {event: harness_build_port_wiring_load_bearing, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:harness_build_port_wiring_load_bearing
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: harness_build_port_wiring_load_bearing

  - id: HBRG-7
    description: Removing selected-environment identity from the pure workload hash in an isolated source copy makes distinct execution contexts collide and the mutant RED.
    gate:
      - {event: workload_environment_binding_load_bearing, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:workload_environment_binding_load_bearing
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: workload_environment_binding_load_bearing

  - id: HBRG-8
    description: Every declared input file is reverified before terminal replay, so an input change refuses stale evidence without redispatch.
    gate:
      - {event: verified_input_change_blocks_stale_replay, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:verified_input_change_blocks_stale_replay
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: verified_input_change_blocks_stale_replay

  - id: HBRG-9
    description: A length-first SQLite query withholds oversized terminal blobs; bounded raw bytes are authenticated with a parent-held HMAC before JSON/schema decode, target tampering is rejected without redispatch, and an isolated decode-first source mutant turns RED.
    gate:
      - {event: target_authentication_rejects_forged_terminal, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:target_authentication_rejects_forged_terminal
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: target_authentication_rejects_forged_terminal

  - id: HBRG-10
    description: Ordinary background descendants in the build process group are killed before terminal settlement and cannot continue unmetered work.
    gate:
      - {event: ordinary_background_descendant_is_closed, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:ordinary_background_descendant_is_closed
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: ordinary_background_descendant_is_closed

  - id: HBRG-11
    description: A wall-clock rollback during execution cannot predate the start or strand a completed build; monotonic elapsed time supplies the completion floor and settlement time.
    gate:
      - {event: clock_rollback_preserves_terminal_settlement, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:clock_rollback_preserves_terminal_settlement
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: clock_rollback_preserves_terminal_settlement

  - id: HBRG-12
    description: The effect adapter refuses an isolation port that cannot attest provider-network denial and resource-authority protection.
    gate:
      - {event: provider_denial_capability_is_required, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:provider_denial_capability_is_required
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: provider_denial_capability_is_required

  - id: HBRG-13
    description: Removing isolation-policy identity from the pure workload hash in an isolated source copy makes distinct security policies collide and the mutant RED.
    gate:
      - {event: workload_isolation_policy_binding_load_bearing, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:workload_isolation_policy_binding_load_bearing
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: workload_isolation_policy_binding_load_bearing

  - id: HBRG-14
    description: The production Darwin sandbox profile and argv are exact pure values that deny network and resource-authority access on every test platform.
    gate:
      - {event: darwin_sandbox_policy_is_exact, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:darwin_sandbox_policy_is_exact
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: darwin_sandbox_policy_is_exact

  - id: HBRG-15
    description: Subprocess output is streamed through a hard workload-bound byte cap; overflow is a typed terminal effect whose bounded evidence and measured usage settle normally, while an isolated cap-removal source mutant turns RED.
    gate:
      - {event: bounded_output_overflow_settles_terminally, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:bounded_output_overflow_settles_terminally
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: bounded_output_overflow_settles_terminally

  - id: HBRG-16
    description: Compatibility-filtered child-environment composition removes exact LakatoTree resource configuration and recognized credential-shaped names while retaining other inherited variables; an optional exact allowlist provides the closed deployment mode, and a filter-removal source mutant turns RED on every platform.
    gate:
      - {event: closed_environment_secret_filter_is_load_bearing, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:closed_environment_secret_filter_is_load_bearing
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: closed_environment_secret_filter_is_load_bearing

  - id: HBRG-17
    description: Resource-authority root policy rejects containment of the working tree, symlinks, foreign ownership, and group or other permissions; isolated policy-removal mutants turn RED.
    gate:
      - {event: resource_root_policy_is_load_bearing, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:resource_root_policy_is_load_bearing
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: resource_root_policy_is_load_bearing

  - id: HBRG-18
    description: Invalid UTF-8 output is replacement-decoded without expanding persisted evidence past the workload-bound byte limit, and the terminal effect settles.
    gate:
      - {event: invalid_utf8_tail_remains_bounded_and_terminal, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:invalid_utf8_tail_remains_bounded_and_terminal
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: invalid_utf8_tail_remains_bounded_and_terminal

  - id: HBRG-19
    description: A stream-read failure after process launch kills the process group, bounded-waits, reaps the leader, and remains an explicit outcome-unknown claim.
    gate:
      - {event: exceptional_stream_cleanup_reaps_leader, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:exceptional_stream_cleanup_reaps_leader
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: exceptional_stream_cleanup_reaps_leader

  - id: HBRG-20
    description: Target SQLite busy or locked failures cross the public boundary as transient outcome-unknown, while corrupt durable state crosses it as a permanent typed target error; raw sqlite exceptions never reach the CLI, including on the Python 3.10 sqlite surface without 3.11 result-code names.
    gate:
      - {event: target_sqlite_failures_are_typed, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:target_sqlite_failures_are_typed
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: target_sqlite_failures_are_typed

  - id: HBRG-21
    description: Every adjustable physical subprocess field has one immutable policy identity; shell, output and cleanup changes alter the digest and workload, while scheduler reservation derives from the exact cleanup value carried by that workload.
    guard_defect: Cleanup grace and output behavior were duplicated literals, so policy-field omission could make physically different executions share an identity or reservation.
    guard_mechanism: BuildExecutionPolicy is frozen and canonically hashed field by field; isolated omission mutants collide and turn RED, policy.make_spec binds the physical values, and reserved_compute_wall_ms derives the scheduler bound from that exact spec.
    gate:
      - {event: execution_policy_is_identity_bound, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:execution_policy_is_identity_bound
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: execution_policy_is_identity_bound

  - id: HBRG-22
    description: Production composition resolves an injected structural deployment-policy port before side effects, uses its isolation and limits, and rejects an unknown enabled selector before creating the authority root.
    guard_defect: The environment factory constructed Darwin sandbox-exec and shell policy internally, preventing safe host adapters and allowing configuration discovery to drift into I/O.
    guard_mechanism: An explicit resolver selects BuildDeploymentPolicyPort; disabled mode bypasses resolution, known policies own isolation construction, unknown names fail before resource-root preparation, and a Darwin-construction source mutant turns RED.
    gate:
      - {event: deployment_policy_is_injected_and_preflighted, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:deployment_policy_is_injected_and_preflighted
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: deployment_policy_is_injected_and_preflighted

  - id: HBRG-23
    description: Manifest JSON and entry count are bounded at load, per-file and total bytes are bounded on every verification, and an optional exact non-sensitive environment allowlist can harden deployment without breaking legacy ordinary variables by default.
    guard_defect: An unbounded manifest could monopolize prelaunch work, while making a new allowlist the default would silently remove build variables from existing callers.
    guard_mechanism: VerifiedBuildInputManifest enforces immutable admission limits with JSON and per-file removal mutants; closed_build_environment always denies exact LakatoTree resource configuration and recognized credential-name patterns, then intersects an exact allowlist only when policy explicitly supplies one.
    gate:
      - {event: bounded_manifest_and_allowlisted_environment, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:bounded_manifest_and_allowlisted_environment
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: bounded_manifest_and_allowlisted_environment

  - id: HBRG-24
    description: A declared-input change detected after the durable claim but before process launch commits INPUT_REJECTED evidence, launches nothing, and settles the resource grant.
    guard_defect: Post-claim verification failure previously left a known-unlaunched CLAIMED row permanently outcome-unknown.
    guard_mechanism: The target adapter converts only the typed bounded input refusal into a measured terminal result before the process port; genuinely ambiguous post-launch failures remain unknown.
    gate:
      - {event: postclaim_input_refusal_terminalizes, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:postclaim_input_refusal_terminalizes
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: postclaim_input_refusal_terminalizes

  - id: HBRG-25
    description: Non-input operational admission tuning has its own immutable identity without manufacturing a physical workload, while environment selection is input-shaping and changes workload identity through the selected environment hash.
    guard_defect: TTL and SQLite tuning were mixed into physical execution identity, while the environment allowlist was incorrectly claimed never to affect the selected workload input.
    guard_mechanism: Frozen BuildExecutionPolicy and BuildAdmissionPolicy values own disjoint fields and hashes; operational tuning stays outside BuildExecutionSpec, while the actual post-filter environment always crosses the spec as environment_sha256.
    gate:
      - {event: operational_admission_and_environment_identity_are_separate, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:operational_admission_and_environment_identity_are_separate
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: operational_admission_and_environment_identity_are_separate

  - id: HBRG-26
    description: Declared files are opened beneath the bound root through no-follow descriptors, the final open is non-blocking before regular-file validation, hashing stops at the pre-read size, EOF and metadata are rechecked, and descriptor failures remain typed.
    guard_defect: Path validation followed by a fresh pathname read allowed symlink and growth races; a regular file replaced by a FIFO could also block forever after durable claim before deadline checks.
    guard_mechanism: Descriptor-relative component walking, O_NONBLOCK on the final descriptor, regular-file fstat, bounded chunking, one-byte growth detection, metadata readback, and typed OSError translation form one bounded verification snapshot; a blocking-open source mutant turns RED.
    gate:
      - {event: descriptor_snapshot_rejects_input_growth, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:descriptor_snapshot_rejects_input_growth
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: descriptor_snapshot_rejects_input_growth

  - id: HBRG-27
    description: Authoritative post-claim input verification starts inside the same timeout and monotonic compute measurement as process execution; a slow rejection is terminal, measured, and launches nothing.
    guard_defect: Input verification after durable authority could consume unmetered time outside both the reservation deadline and terminal usage evidence.
    guard_mechanism: The target starts its monotonic interval and absolute deadline immediately after claim, passes the deadline into descriptor verification, and gives only the remainder to the process port.
    gate:
      - {event: postclaim_verification_time_is_metered, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:postclaim_verification_time_is_metered
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: postclaim_verification_time_is_metered

  - id: HBRG-28
    description: The workload-bound output cap is deterministically split into stdout-ceil and stderr-floor quotas with no borrowing, including odd totals; subprocess and synthetic terminal stderr obey the same split, and scheduling order cannot change each stream's admitted maximum.
    guard_defect: A shared stdout/stderr byte pool made persisted evidence depend on selector readiness order and a naive per-stream cap could double the declared total.
    guard_mechanism: split_stream_budget is a pure closed strategy bound into BuildExecutionSpec; actual overflow evidence and a shared-budget source mutant prove the split is load-bearing.
    gate:
      - {event: stream_capture_budget_is_deterministically_split, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:stream_capture_budget_is_deterministically_split
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: stream_capture_budget_is_deterministically_split

  - id: HBRG-29
    description: An explicitly injected harness_run build callable remains authoritative and suppresses resource-policy resolution, preserving the public test and embedding seam.
    guard_defect: Composition-root refactoring could overwrite an explicit run_build injection whenever build_cmd was present.
    guard_mechanism: Factory resolution occurs only when run_build is absent; an isolated conditional mutant invokes a forbidden factory and turns RED.
    gate:
      - {event: explicit_run_build_override_is_preserved, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:explicit_run_build_override_is_preserved
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: explicit_run_build_override_is_preserved

  - id: HBRG-30
    description: The production v2 durable effect accepts only a deadline-bound input verifier and invokes that port directly after claim; a preflight-only verifier is rejected before target I/O.
    guard_defect: A structural fallback to unbounded verify could hold a durable claim and scope lock forever when an injected verifier failed to return.
    guard_mechanism: DeadlineBoundBuildInputVerifierPort requires verify_until, DeadlineBoundSQLiteFencedBuildEffect validates the method before schema bootstrap, post-claim dispatch has no compatibility fallback, and a constructor-guard source mutant turns RED.
    gate:
      - {event: deadline_aware_verifier_port_is_required, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:deadline_aware_verifier_port_is_required
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: deadline_aware_verifier_port_is_required

  - id: HBRG-31
    description: Existing verify-only BuildInputVerifierPort callers remain accepted by the explicitly legacy SQLiteFencedBuildEffect, while production selects a separately versioned DeadlineBoundSQLiteFencedBuildEffect whose workload, target-store, and lock identities cannot replay or collide with legacy evidence.
    guard_defect: Strengthening an already public verifier protocol in place broke injected implementations; sharing an adapter version would mislabel legacy evidence, while sharing the v1 SQLite filename would make existing installations fail every v2 restart on target metadata drift.
    guard_mechanism: The v1 protocol, effect, and build-target.sqlite3 remain unchanged; the v2 protocol and effect carry a distinct adapter version and build-target-v2.sqlite3 namespace; the factory selects only v2 without modifying v1 bytes; adapter-version and target-filename collision mutants turn RED.
    gate:
      - {event: versioned_effect_boundary_preserves_legacy_verifier_compatibility, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:versioned_effect_boundary_preserves_legacy_verifier_compatibility
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: versioned_effect_boundary_preserves_legacy_verifier_compatibility

  - id: HBRG-32
    description: An injected typed deployment resolver owns its required default policy name when configuration omits a selector, while only the ambient compatibility adapter retains the published Darwin fallback for older string-only resolvers.
    guard_defect: The generic composition root either manufactured a macOS policy for portable resolvers or passed None through the established string-only resolver contract.
    guard_mechanism: The typed resolver port declares default_policy_name and generic resolution fails closed without it; resolver-owned-default, generic-Darwin-fallback, and missing compatibility-fallback mutants turn RED.
    gate:
      - {event: deployment_resolver_owns_default_selection, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:deployment_resolver_owns_default_selection
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: deployment_resolver_owns_default_selection

  - id: HBRG-33
    description: All durable harness-build identifiers are derived and consumed as one immutable bundle; the published v1 namespace is sealed, all prior non-NUL bytes remain compatible, and ambiguous NUL components are rejected before I/O.
    guard_defect: Scattered prefix assembly allowed partial identity drift, while NUL-delimited tree/tag framing admitted colliding tuples such as ('a NUL b','c') and ('a','b NUL c').
    guard_mechanism: The sealed BuildIdentityPolicy validates components and returns the complete bundle used by composition; NUL-validation, budget-consumption, and issuer-consumption mutants turn RED.
    gate:
      - {event: canonical_build_identity_bundle_is_load_bearing, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:canonical_build_identity_bundle_is_load_bearing
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: canonical_build_identity_bundle_is_load_bearing

  - id: HBRG-34
    description: Typed configuration parsing is separated from composition, supports an injected environment-key schema, always reserves the canonical keys, strips KEY_HEX names and byte-equivalent authority values including whitespace-formatted hex aliases, and preserves the empty-mapping disabled-mode contract.
    guard_defect: Literal environment names inside the composition mixed secret parsing, policy selection, and runtime wiring and made alternate embedding adapters unsafe to add.
    guard_mechanism: ResourceBuildEnvironmentKeys and secret-safe ResourceBuildConfig form the adapter boundary; root-key, policy-key, canonical-reserved-union, KEY_HEX-name, and normalized-authority-value mutants fail the custom schema probe.
    gate:
      - {event: typed_environment_configuration_boundary_is_load_bearing, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:typed_environment_configuration_boundary_is_load_bearing
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: typed_environment_configuration_boundary_is_load_bearing

  - id: HBRG-35
    description: Typed composition consumes one explicit canonical workspace root and one injected authority clock for request time, expiry, and later gate authorization.
    guard_defect: Ambient process CWD could change the workload root and separate system clocks could disagree across request construction and permit authorization.
    guard_mechanism: resource_gated_build_runner_from_config requires workspace_root, resolver, and clock and shares that ClockPort with expiry construction and ResourceExecutionGate; ambient-CWD, fresh-gate-clock, and ambient-expiry-clock mutants turn RED with typed or direct observables.
    gate:
      - {event: explicit_workspace_and_authority_clock_are_load_bearing, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:HARNESS_BUILD_RESOURCE_GATE:explicit_workspace_and_authority_clock_are_load_bearing
      source: harness_build_resource_gate_receipt.py
      symbol: verify
      must_emit: explicit_workspace_and_authority_clock_are_load_bearing
