# hermetic — 네트워크/KG/시크릿 0 (stub kg 주입, 판정 계산 경로만 실코드).
# 무엇을 구동하나: server/contexts/tree/repository.py (load_tree_data → assurance_with_context)
# + evidence_claim_service.standing — T2 verdict anchor가 없는 legacy T1 표식의 VAL L2 ceiling.
# 음성 오라클: 구 witness boolean은 무시 / sealed engine sha off-floor → L2 / lock 부재 → L1.
name: lakatotree-advancement-p3-val-readpath
target:
  mode: in_process
  callable: p3_val_readpath_receipt:verify
  backend: memory
  root: "."

requirements:
  - id: P3VR-1
    description: T1 prediction anchor와 server clock에서 파생된 legacy temporal_witness_verified boolean은 receipt-bound T2 verdict anchor가 아니므로 repository와 standing 영구 표면 모두 val==2를 넘지 못한다.
    gate:
      - {event: legacy_t1_capped_on_repository_read, op: ">=", count: 1}
      - {event: legacy_t1_capped_on_standing_surface, op: ">=", count: 1}
    longinus:
      kg_anchor: ref_site:P3_VAL_READPATH:legacy_t1_capped_on_repository_read
      source: p3_val_readpath_receipt.py
      symbol: verify
      must_emit: legacy_t1_capped_on_repository_read
  - id: P3VR-2
    description: 게이트가 실제로 판별한다(no-fake-green) — 같은 노드에서 연언 하나씩 죽이면 정확히 그 사다리로 떨어진다. witness flip → L2, 봉인 sha 를 floor 밖 값으로 → L2(항진명제 해소의 실체 — 구 판관 노드는 L3 불가), lock sha 제거 → L1(measurement_lock_unbound). 셋 중 하나라도 L3 로 새면 이 영수증이 틀린다.
    gate:
      - {event: negative_oracles_discriminate, op: ">=", count: 1}
    longinus:
      kg_anchor: ref_site:P3_VAL_READPATH:negative_oracles_discriminate
      source: p3_val_readpath_receipt.py
      symbol: verify
      must_emit: negative_oracles_discriminate
