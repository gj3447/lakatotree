name: lakatotree-storage-access-attestation
target:
  mode: in_process
  callable: storage_access_attestation_receipt:verify
  backend: memory
  root: "."

requirements:
  - id: SAA-1
    description: Exact access policy fixes pairwise-distinct datastore principals, two datastore attestor keys, a third distinct fence authority, and one concrete canonical Neo4j application database.
    gate:
      - {event: exact_policy_and_signer_separation_enforced, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:STORAGE_ACCESS_ATTESTATION:exact_policy_and_signer_separation_enforced
      source: storage_access_attestation_receipt.py
      symbol: verify
      must_emit: exact_policy_and_signer_separation_enforced

  - id: SAA-2
    description: The exact raw policy, v5 receipt, predeploy bundle, and startup bundle verify as one source/target-bound chain without granting deployment approval, including a proxy/NAT target whose configured client endpoint differs from its observed backend endpoint while both remain content-bound.
    gate:
      - {event: signed_phase_pair_verified_claim_bounded, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:STORAGE_ACCESS_ATTESTATION:signed_phase_pair_verified_claim_bounded
      source: storage_access_attestation_receipt.py
      symbol: verify
      must_emit: signed_phase_pair_verified_claim_bounded

  - id: SAA-3
    description: Raw duplicate/schema, signature, signer, phase, expiry, artifact-operation, file-pin, and cross-phase nonce-reuse attacks fail closed; the stateless verifier does not claim one-time consumption of an otherwise valid pair.
    gate:
      - {event: crypto_schema_cross_phase_nonce_attacks_rejected, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:STORAGE_ACCESS_ATTESTATION:crypto_schema_cross_phase_nonce_attacks_rejected
      source: storage_access_attestation_receipt.py
      symbol: verify
      must_emit: crypto_schema_cross_phase_nonce_attacks_rejected

  - id: SAA-4
    description: PostgreSQL and Neo4j missing or excess authority, immutable grants, unsupported semantics, unstable authorization snapshots, independently anchored target/principal splices, within-phase drift, cross-store or cross-phase drift, and expired handoff fail closed under an exact executed-control manifest.
    gate:
      - {event: authority_and_drift_attacks_rejected, op: "==", count: 1}
    longinus:
      kg_anchor: ref_site:STORAGE_ACCESS_ATTESTATION:authority_and_drift_attacks_rejected
      source: storage_access_attestation_receipt.py
      symbol: verify
      must_emit: authority_and_drift_attacks_rejected
